services:
  backend-1:
    image: ghcr.io/micheloliveira-com/rinha-de-backend-2025-dotnet-csharp-mongodb:latest
    hostname: backend-1
    networks:
      - backend
      - payment-processor
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - WORKER_SIZE=25
      - BATCH_SIZE=250
      - DEFAULT_PROCESSOR_CIRCUIT_ERROR_THRESHOLD_SECONDS=1
      - ConnectionStrings__default=http://payment-processor-default:8080
      - ConnectionStrings__fallback=http://payment-processor-fallback:8080
      - ConnectionStrings__mongodb=mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: >
        for i in $$(seq 1 60); do
          wget -q --tries=1 --spider http://localhost:8080/payments-summary && break
          sleep 1
        done
      interval: 1h
      timeout: 70s
      retries: 0
      start_period: 1s
    ports:
      - "8080"
    deploy:
      resources:
        limits:
          cpus: "0.55"
          memory: "145MB"

  backend-2:
    image: ghcr.io/micheloliveira-com/rinha-de-backend-2025-dotnet-csharp-mongodb:latest
    hostname: backend-2
    networks:
      - backend
      - payment-processor
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - WORKER_SIZE=25
      - BATCH_SIZE=250
      - DEFAULT_PROCESSOR_CIRCUIT_ERROR_THRESHOLD_SECONDS=1
      - ConnectionStrings__default=http://payment-processor-default:8080
      - ConnectionStrings__fallback=http://payment-processor-fallback:8080
      - ConnectionStrings__mongodb=mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: >
        for i in $$(seq 1 60); do
          wget -q --tries=1 --spider http://localhost:8080/payments-summary && break
          sleep 1
        done
      interval: 1h
      timeout: 70s
      retries: 0
      start_period: 1s
    ports:
      - "8080"
    deploy:
      resources:
        limits:
          cpus: "0.55"
          memory: "145MB"

  mongodb:
    image: mongo:8.0
    hostname: mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--quiet"]
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (error) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb:27017\"}]}).ok }' | grep 1"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 15s
    #deploy:
    #  resources:
    #    limits:
    #      cpus: "0.2"
    #      # MongoDB 8 uses a 256 MB minimum WiredTiger cache. Leave enough room
    #      # for the server and the mongosh replica-set health check.
    #      memory: "768MB"

  load-balancer:
    image: haproxy:3.2.4-alpine
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    ports:
      - "9999:9999"
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "50MB"

networks:
  backend:
    driver: bridge
  payment-processor:
    external: true
