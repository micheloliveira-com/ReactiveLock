      dockerfile: test/integration/dotnet-csharp-mongodb/src/backend/Dockerfile
      args:
        USE_REACTIVELOCK_PACKAGE_REFERENCES: ${USE_REACTIVELOCK_PACKAGE_REFERENCES:-false}
    image: rinha-de-backend-2025-dotnet-csharp-mongodb:latest
  backend-2:
    build:
      context: ../../../..
