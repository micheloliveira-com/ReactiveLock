services:
  backend-1:
    image: ghcr.io/micheloliveira-com/rinha-de-backend-2025-dotnet-csharp-rabbitmq:latest
    hostname: backend-1
    networks: [backend, payment-processor]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - WORKER_SIZE=25
      - BATCH_SIZE=250
      - DEFAULT_PROCESSOR_CIRCUIT_ERROR_THRESHOLD_SECONDS=1
      - ConnectionStrings__default=http://payment-processor-default:8080
      - ConnectionStrings__fallback=http://payment-processor-fallback:8080
      - ConnectionStrings__rabbitmq=amqp://guest:guest@rabbitmq:5672
    healthcheck: &backend-healthcheck
      test: >
        for i in $(seq 1 60); do
          wget -q --tries=1 --spider http://localhost:8080/payments-summary && break
          sleep 1
        done
      interval: 1h
      timeout: 70s
      retries: 0
      start_period: 1s
    ports: ["8080"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: "145MB"

  backend-2:
    image: ghcr.io/micheloliveira-com/rinha-de-backend-2025-dotnet-csharp-rabbitmq:latest
    hostname: backend-2
    networks: [backend, payment-processor]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - WORKER_SIZE=25
      - BATCH_SIZE=250
      - DEFAULT_PROCESSOR_CIRCUIT_ERROR_THRESHOLD_SECONDS=1
      - ConnectionStrings__default=http://payment-processor-default:8080
      - ConnectionStrings__fallback=http://payment-processor-fallback:8080
      - ConnectionStrings__rabbitmq=amqp://guest:guest@rabbitmq:5672
    healthcheck: *backend-healthcheck
    ports: ["8080"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: "145MB"

  rabbitmq:
    image: rabbitmq:4.1-alpine
    networks: [backend]
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 2s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "90MB"

  load-balancer:
    image: haproxy:3.2.4-alpine
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    ports:
      - "9999:9999"
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "50MB"

networks:
  backend:
    driver: bridge
  payment-processor:
    external: true
