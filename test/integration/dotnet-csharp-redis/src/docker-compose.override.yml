services:
  backend-1:
    build:
      context: ../../../..
      dockerfile: test/integration/dotnet-csharp-redis/src/backend/Dockerfile
      args:
        USE_REACTIVELOCK_PACKAGE_REFERENCES: ${USE_REACTIVELOCK_PACKAGE_REFERENCES:-false}
    image: rinha-de-backend-2025-dotnet-csharp-redis:latest
  backend-2:
    build:
      context: ../../../..
      dockerfile: test/integration/dotnet-csharp-redis/src/backend/Dockerfile
      args:
        USE_REACTIVELOCK_PACKAGE_REFERENCES: ${USE_REACTIVELOCK_PACKAGE_REFERENCES:-false}
    image: rinha-de-backend-2025-dotnet-csharp-redis:latest
  redis:
    ports:
      - "6379:6379"
